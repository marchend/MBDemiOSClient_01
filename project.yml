name: AcmeBank
options:
  bundleIdPrefix: com.acmebank
  deploymentTarget:
    iOS: "17.0"
packages:
  # Okta's official Swift SDK. We depend ONLY on the OktaDirectAuth
  # product — direct (resource-owner-password-grant style) authentication
  # against the Okta tenant. No browser-based WebAuthenticationUI, no
  # legacy OktaOidc, no manual OAuth2/AuthFoundation wiring.
  OktaMobileSwift:
    url: https://github.com/okta/okta-mobile-swift
    minVersion: 2.0.0
targets:
  AcmeBank:
    type: application
    platform: iOS
    sources: [AcmeBank]
    resources: [AcmeBank/Resources]
    dependencies:
      - package: OktaMobileSwift
        product: OktaDirectAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmebank.mobile
        SWIFT_VERSION: "5.10"
        # We ship an explicit Info.plist (AcmeBank/Info.plist) so that
        # `Scripts/inject-okta-config.sh` has a stable file to write
        # the four Okta* keys into via `plutil -replace`. Letting Xcode
        # auto-generate the Info.plist would defeat the build-time
        # injection because GENERATE_INFOPLIST_FILE rewrites the file
        # on every build, after our script runs.
        INFOPLIST_FILE: AcmeBank/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_ENTITLEMENTS: AcmeBank/AcmeBank.entitlements
    postBuildScripts:
      # Bridges shell env vars (OKTA_ISSUER, OKTA_CLIENT_ID,
      # OKTA_REDIRECT_URI, OKTA_SCOPES) into the built Info.plist after
      # "Copy Bundle Resources" has placed it in BUILT_PRODUCTS_DIR.
      # Missing env vars are written as `__OKTA_..._UNSET__` sentinels
      # and detected at runtime by `OktaConfig.load()`; the build never
      # fails just because a dev hasn't set the vars yet.
      - script: "\"$SRCROOT/Scripts/inject-okta-config.sh\""
        name: Inject Okta Config
        basedOnDependencyAnalysis: false
  AcmeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcmeBankTests]
    dependencies:
      - target: AcmeBank
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
  AcmeBankUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AcmeBankUITests]
    dependencies:
      - target: AcmeBank
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  AcmeBank:
    build:
      targets: { AcmeBank: all }
    test:
      targets: [AcmeBankTests, AcmeBankUITests]
      parallelizable: false
